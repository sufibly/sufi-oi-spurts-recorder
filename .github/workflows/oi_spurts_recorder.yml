name: 1-Minute Live NSE OI Spurts Cloud Recorder

on:
  schedule:
    # GitHub starts scheduled jobs late (often by hours). Firing every 15 minutes means some run always
    # starts inside market hours; runs outside 08:50-15:30 IST exit in a few seconds.
    - cron: '*/15 * * * 1-5'
  push:
    paths:
      - 'recorder.py'
      - '.github/workflows/oi_spurts_recorder.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal = record now (market hours only), test = one NSE fetch'
        required: false
        default: 'normal'

permissions:
  contents: write

concurrency:
  # one recorder at a time; a second one waits and takes over when the first hands over
  group: sufi-oi-spurts-${{ github.event_name == 'push' && 'test' || 'cloud' }}
  cancel-in-progress: false

jobs:
  stream-to-gsheet:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run recorder
        env:
          GSHEET_WEBHOOK_URL: "https://script.google.com/macros/s/AKfycbxgojskx6zSHeSPHnhqPwxVNpcbE2HfDDCon41vGRJXTLMlk8BK3h95ganuUqOCGYtz/exec"
          RUN_MODE: ${{ github.event_name == 'push' && 'test' || github.event.inputs.mode || 'normal' }}
          MAX_RUN_MINUTES: "350"
        run: python recorder.py

      - name: Keep the schedule alive (GitHub switches schedules off after 60 quiet days)
        if: always() && github.event_name == 'schedule'
        run: |
          MONTH=$(date -u +%Y-%m)
          if [ "$(cat HEARTBEAT.txt 2>/dev/null)" != "$MONTH" ]; then
            echo "$MONTH" > HEARTBEAT.txt
            git config user.name "oi-spurts-recorder"
            git config user.email "actions@users.noreply.github.com"
            git add HEARTBEAT.txt
            git commit -m "heartbeat $MONTH" || true
            git push || true
          fi
